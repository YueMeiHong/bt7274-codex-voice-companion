name: Prepare tagged release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require matching release version
        shell: pwsh
        run: |
          $btVersion=(Get-Content plugin.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$btVersion") { throw 'Tag does not match plugin version' }
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.in
      - name: Verify source and publication package
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p "test_*.py"
          if ($LASTEXITCODE) { throw 'Tests failed' }
          python scripts/validate_publication.py
          if ($LASTEXITCODE) { throw 'Publication validation failed' }
          ./Scan-Secrets.ps1 -Directory .
          ./Build-Release.ps1
      - name: Create preview release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $btAssets=@(Get-ChildItem dist/*.zip,dist/*.verification.json | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @btAssets --draft --prerelease --verify-tag --title "BT $env:GITHUB_REF_NAME preview" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE) { throw 'Release draft creation failed' }
