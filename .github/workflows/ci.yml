name: BT source and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.in
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.in
      - name: Source, protocol and security tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Publication consistency
        run: python scripts/validate_publication.py
      - name: Secret scan
        shell: pwsh
        run: ./Scan-Secrets.ps1 -Directory .
      - name: Build and verify source archive
        shell: pwsh
        run: ./Build-Release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bt-source-candidate
          path: |
            dist/*.zip
            dist/*.verification.json
          if-no-files-found: error
