name: BT source and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.in
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.in
      - name: Source, protocol and security tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Publication consistency
        run: python scripts/validate_publication.py
      - name: Secret scan
        shell: pwsh
        run: ./Scan-Secrets.ps1 -Directory .
      - name: Build and verify source archive
        shell: pwsh
        run: ./Build-Release.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bt-source-candidate
          path: |
            dist/*.zip
            dist/*.verification.json
          if-no-files-found: error
